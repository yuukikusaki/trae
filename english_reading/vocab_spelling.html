<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语词汇拼写练习</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px; color: #333; background: #f0f2f5; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; font-family: inherit; }
input { font-family: inherit; }

/* ===== Layout ===== */
.app-container { display: flex; height: 100vh; overflow: hidden; }

/* ===== Sidebar ===== */
.sidebar {
  width: 300px; min-width: 300px; background: #fff;
  border-right: 1px solid #e0e0e0; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 2px 0 8px rgba(0,0,0,0.05); z-index: 10;
}
.sidebar-header {
  padding: 18px 20px; background: linear-gradient(135deg, #1a73e8, #1557b0);
  color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 10px;
}
.sidebar-header .icon { font-size: 22px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

.nav-all {
  display: flex; align-items: center; padding: 12px 20px; margin: 4px 10px;
  border-radius: 8px; cursor: pointer; transition: all 0.15s; font-weight: 600;
  font-size: 15px; color: #1a73e8; border: 2px solid #1a73e8;
  justify-content: space-between; background: #e8f0fe;
}
.nav-all:hover { background: #d2e3fc; }
.nav-all .count { 
  background: #1a73e8; color: #fff; font-size: 12px; padding: 2px 10px;
  border-radius: 12px; font-weight: 600;
}

.cat-group { margin: 4px 0; }
.cat-group-header {
  display: flex; align-items: center; padding: 11px 20px; margin: 2px 10px;
  border-radius: 8px; cursor: pointer; transition: all 0.15s; font-weight: 600;
  font-size: 14px; color: #444; user-select: none;
}
.cat-group-header:hover { background: #f1f3f4; }
.cat-group-header .arrow { margin-right: 8px; font-size: 10px; transition: transform 0.2s; color: #888; }
.cat-group-header.expanded .arrow { transform: rotate(90deg); }
.cat-group-header .count {
  margin-left: auto; font-size: 12px; color: #888; font-weight: 500;
}

.cat-items { display: none; padding: 2px 0 4px; }
.cat-group-header.expanded + .cat-items { display: block; }
.cat-item {
  display: flex; align-items: center; padding: 9px 20px 9px 44px; margin: 1px 6px;
  border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 13px;
  color: #555; justify-content: space-between;
}
.cat-item:hover { background: #f1f3f4; }
.cat-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }
.cat-item .count { font-size: 11px; color: #999; }

/* ===== Main Content ===== */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ===== Top Bar ===== */
.top-bar {
  padding: 14px 28px; background: #fff; border-bottom: 1px solid #e0e0e0;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.top-bar h1 { font-size: 20px; font-weight: 700; color: #1a73e8; }
.tab-nav { display: flex; gap: 2px; background: #f0f2f5; border-radius: 8px; padding: 3px; }
.tab-btn {
  padding: 8px 20px; border-radius: 6px; font-size: 14px; font-weight: 500;
  color: #666; background: transparent; transition: all 0.15s;
}
.tab-btn:hover { background: #e8e8e8; }
.tab-btn.active { background: #1a73e8; color: #fff; }

/* ===== Tab Panels ===== */
.tab-panel { flex: 1; overflow-y: auto; padding: 24px 28px; display: none; }
.tab-panel.active { display: block; }

/* ===== Practice Panel ===== */
.practice-container { max-width: 700px; margin: 0 auto; }
.practice-card {
  background: #fff; border-radius: 12px; padding: 36px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.practice-progress {
  font-size: 13px; color: #888; margin-bottom: 24px; display: flex; justify-content: space-between;
  align-items: center;
}
.progress-bar-wrap { flex: 1; height: 5px; background: #e8eaed; border-radius: 3px; margin: 0 16px; overflow: hidden; }
.progress-bar-inner { height: 100%; background: #1a73e8; border-radius: 3px; transition: width 0.3s; }

.practice-chinese {
  font-size: 28px; font-weight: 700; color: #222; text-align: center; margin-bottom: 8px;
  line-height: 1.5;
}
.practice-hint { text-align: center; font-size: 13px; color: #999; margin-bottom: 24px; }
.practice-hint .category-tag {
  display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 2px 10px;
  border-radius: 12px; font-size: 12px; margin-right: 6px;
}
.practice-hint .type-tag {
  display: inline-block; background: #fff3cd; color: #856404; padding: 2px 10px;
  border-radius: 12px; font-size: 12px;
}
.practice-input-row { display: flex; gap: 10px; margin-bottom: 16px; }
.practice-input {
  flex: 1; padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 8px;
  font-size: 18px; outline: none; transition: border-color 0.2s;
}
.practice-input:focus { border-color: #1a73e8; }
.practice-input.correct { border-color: #34a853; background: #f0fff4; }
.practice-input.incorrect { border-color: #ea4335; background: #fff5f5; }
.btn-submit {
  padding: 14px 28px; background: #1a73e8; color: #fff; font-size: 16px;
  border-radius: 8px; font-weight: 600; transition: background 0.15s;
}
.btn-submit:hover { background: #1557b0; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }

.practice-feedback {
  min-height: 52px; padding: 12px 18px; border-radius: 8px; margin-bottom: 12px;
  font-size: 15px; display: none;
}
.practice-feedback.show { display: block; }
.practice-feedback.correct { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
.practice-feedback.incorrect { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c2; }
.feedback-answer { font-weight: 700; margin-top: 6px; font-size: 18px; }

.practice-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-action {
  padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 500;
  transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.btn-prev { background: #f1f3f4; color: #555; }
.btn-prev:hover { background: #e0e0e0; }
.btn-skip { background: #f1f3f4; color: #555; }
.btn-skip:hover { background: #e0e0e0; }
.btn-next { background: #1a73e8; color: #fff; display: none; }
.btn-next.show { display: flex; }
.btn-next:hover { background: #1557b0; }
.btn-mastered { background: #fef7e0; color: #e37400; border: 1px solid #f9ab00; }
.btn-mastered:hover { background: #feefc3; }
.btn-mastered.mastered { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
.btn-notes-toggle { background: #f1f3f4; color: #555; font-size: 13px; padding: 6px 12px; }
.btn-notes-toggle:hover { background: #e0e0e0; }
.practice-notes {
  display: none; margin-top: 12px; padding: 12px 16px; background: #f8f9fa;
  border-radius: 8px; font-size: 13px; color: #666; border-left: 3px solid #1a73e8;
}
.practice-notes.show { display: block; }

.practice-copy-cn {
  display: none; text-align: center; font-size: 16px; color: #666;
  margin-bottom: 12px; padding: 6px; background: #fef7e0; border-radius: 6px;
}
.practice-copy-cn.show { display: block; }
.btn-copy-cn-toggle {
  background: #fff3cd; color: #856404; font-size: 13px; padding: 6px 14px;
  border: 1px solid #f9ab00; display: none;
}
.btn-copy-cn-toggle:hover { background: #feefc3; }
.btn-copy-cn-toggle.show { display: flex; }

.practice-mode-toggle { display: flex; gap: 0; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 2px solid #e0e0e0; }
.mode-btn { padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: #fff; color: #666; transition: all 0.15s; }
.mode-btn:hover { background: #f1f3f4; }
.mode-btn.active { background: #1a73e8; color: #fff; }

.practice-empty { text-align: center; padding: 60px; color: #999; font-size: 16px; }

/* ===== Word Book Panel ===== */
.wordbook-controls {
  display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;
}
.wb-search {
  flex: 1; min-width: 200px; padding: 10px 16px; border: 2px solid #e0e0e0;
  border-radius: 8px; font-size: 14px; outline: none;
}
.wb-search:focus { border-color: #1a73e8; }
.wb-filter { padding: 10px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; background: #fff; cursor: pointer; }
.wb-filter:focus { border-color: #1a73e8; }
.wb-count { font-size: 13px; color: #888; margin-left: auto; }

.word-table { width: 100%; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
.word-table table { width: 100%; border-collapse: collapse; }
.word-table th {
  padding: 12px 16px; background: #f8f9fa; font-size: 13px; color: #666; font-weight: 600;
  text-align: left; border-bottom: 2px solid #e0e0e0; position: sticky; top: 0; z-index: 1;
}
.word-table td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
.word-table tr:hover td { background: #f8f9fa; }
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500;
}
.status-badge.not-learned { background: #f1f3f4; color: #666; }
.status-badge.learning { background: #e8f0fe; color: #1a73e8; }
.status-badge.mastered { background: #e6f4ea; color: #137333; }
.mastered-toggle {
  padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #ddd;
  background: #fff; color: #555; transition: all 0.15s;
}
.mastered-toggle:hover { background: #e6f4ea; border-color: #34a853; color: #137333; }
.mastered-toggle.is-mastered { background: #e6f4ea; border-color: #34a853; color: #137333; }

/* ===== Review Queue Panel ===== */
.review-summary {
  display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
}
.review-stat {
  background: #fff; padding: 20px 24px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  flex: 1; min-width: 140px; text-align: center;
}
.review-stat .value { font-size: 32px; font-weight: 700; color: #1a73e8; }
.review-stat .label { font-size: 13px; color: #888; margin-top: 4px; }

.review-section { max-width: 700px; margin: 0 auto; }
.btn-start-review {
  display: block; width: 100%; padding: 14px; background: #1a73e8; color: #fff;
  font-size: 16px; font-weight: 600; border-radius: 8px; margin-bottom: 20px;
  transition: background 0.15s;
}
.btn-start-review:hover { background: #1557b0; }
.btn-start-review:disabled { background: #ccc; }

.review-card {
  background: #fff; border-radius: 12px; padding: 36px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.review-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.review-item:last-child { border-bottom: none; }
.review-item .word { font-weight: 600; color: #222; }
.review-item .meaning { color: #666; }
.review-empty { text-align: center; padding: 40px; color: #999; }

/* ===== Stats Panel ===== */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  text-align: center;
}
.stat-card .value { font-size: 36px; font-weight: 700; color: #1a73e8; }
.stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
.stat-card.sub .value { font-size: 28px; color: #34a853; }

.stats-table { width: 100%; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.04); margin-top: 16px; }
.stats-table table { width: 100%; border-collapse: collapse; }
.stats-table th {
  padding: 12px 16px; background: #f8f9fa; font-size: 13px; color: #666; font-weight: 600;
  text-align: left; border-bottom: 2px solid #e0e0e0;
}
.stats-table td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .app-container { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; max-height: 40vh; }
  .main-content { height: 60vh; }
  .practice-card { padding: 20px; }
  .practice-chinese { font-size: 22px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="app-container">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="icon">&#x1F4DA;</span>
      词汇分类
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main-content">
    <div class="top-bar">
      <h1>&#x270D;&#xFE0F; 考研英语词汇拼写练习</h1>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="practice">&#x1F4DD; 练习</button>
        <button class="tab-btn" data-tab="wordbook">&#x1F4D6; 单词本</button>
        <button class="tab-btn" data-tab="review">&#x1F504; 复习队列</button>
        <button class="tab-btn" data-tab="stats">&#x1F4CA; 统计</button>
      </nav>
    </div>

    <!-- Practice Tab -->
    <div class="tab-panel active" id="panel-practice">
      <div class="practice-container">
        <div class="practice-mode-toggle">
          <button class="mode-btn active" id="modeSpelling" onclick="setPracticeMode('spelling')">拼写模式</button>
          <button class="mode-btn" id="modeCopying" onclick="setPracticeMode('copying')">抄写模式</button>
        </div>
        <div class="practice-card" id="practiceCard">
          <div class="practice-progress" id="practiceProgress"></div>
          <div class="practice-chinese" id="practiceChinese"></div>
          <div class="practice-copy-cn" id="practiceCopyCn"></div>
          <div class="practice-hint" id="practiceHint"></div>
          <div class="practice-input-row">
            <input type="text" class="practice-input" id="practiceInput" placeholder="输入英文..." autocomplete="off" autocorrect="off" spellcheck="false">
            <button class="btn-submit" id="btnSubmit">&#x2713; 提交</button>
          </div>
          <div class="practice-feedback" id="practiceFeedback"></div>
          <div class="practice-actions">
            <button class="btn-action btn-prev" id="btnPrev">&#x2B05; 上一个</button>
            <button class="btn-action btn-skip" id="btnSkip">&#x23ED; 跳过</button>
            <button class="btn-action btn-next" id="btnNext">&#x27A1; 下一个</button>
            <button class="btn-action btn-mastered" id="btnMastered" title="标记为已掌握">&#x2B50; 标记掌握</button>
            <button class="btn-action btn-copy-cn-toggle" id="btnCopyCnToggle" title="显示/隐藏中文释义">&#x1F441; 显示中文</button>
            <button class="btn-action btn-notes-toggle" id="btnNotesToggle">&#x2139; 用法提示</button>
          </div>
          <div class="practice-notes" id="practiceNotes"></div>
        </div>
        <div class="practice-empty" id="practiceEmpty" style="display:none;">
          该分类暂无单词可供练习。
        </div>
      </div>
    </div>

    <!-- Word Book Tab -->
    <div class="tab-panel" id="panel-wordbook">
      <div class="wordbook-controls">
        <input type="text" class="wb-search" id="wbSearch" placeholder="搜索英文或中文...">
        <select class="wb-filter" id="wbCategoryFilter">
          <option value="all">全部分类</option>
        </select>
        <select class="wb-filter" id="wbStatusFilter">
          <option value="all">全部状态</option>
          <option value="not-learned">未学习</option>
          <option value="learning">学习中</option>
          <option value="mastered">已掌握</option>
        </select>
        <select class="wb-filter" id="wbTypeFilter">
          <option value="all">全部类型</option>
          <option value="word">单词/短语</option>
          <option value="sentence">句型</option>
        </select>
        <span class="wb-count" id="wbCount"></span>
      </div>
      <div class="word-table" id="wordTable"></div>
    </div>

    <!-- Review Queue Tab -->
    <div class="tab-panel" id="panel-review">
      <div class="review-summary">
        <div class="review-stat">
          <div class="value" id="rvDueCount">0</div>
          <div class="label">今日待复习</div>
        </div>
        <div class="review-stat">
          <div class="value" id="rvReviewedToday">0</div>
          <div class="label">今日已复习</div>
        </div>
        <div class="review-stat">
          <div class="value" id="rvMasteredCount">0</div>
          <div class="label">已掌握</div>
        </div>
      </div>
      <div class="review-section" id="reviewSection">
        <button class="btn-start-review" id="btnStartReview">&#x25B6; 开始复习 (待复习单词)</button>
        <div class="word-table" id="reviewList"></div>
      </div>
      <div class="review-card" id="reviewPracticeCard" style="display:none;"></div>
    </div>

    <!-- Stats Tab -->
    <div class="tab-panel" id="panel-stats">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="stTotal">0</div>
          <div class="label">词汇总数</div>
        </div>
        <div class="stat-card sub">
          <div class="value" id="stMastered">0</div>
          <div class="label">已掌握</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stReviewedToday">0</div>
          <div class="label">今日复习数</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stDueCount">0</div>
          <div class="label">待复习数</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stAccuracy">0%</div>
          <div class="label">正确率</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stLearning">0</div>
          <div class="label">学习中</div>
        </div>
      </div>
      <div class="stats-table" id="statsTable"></div>
    </div>
  </main>
</div>

// ===== CONSTANTS =====
const STORAGE_KEY = 'vocab_spelling_data';
const REVIEW_INTERVALS = [1, 3, 7, 14, 30]; // days

// ===== STATE =====
let appState = {
  masteredWords: new Set(),       // Set of word IDs that are mastered
  reviewData: {},                 // { [wordId]: { interval, repetitions, easiness, nextReviewDate, lastReviewDate } }
  practiceHistory: [],            // [{ wordId, correct, timestamp }]
  accuracyData: { total: 0, correct: 0 },
  currentCategory: 'all',         // selected category filter
  currentTab: 'practice',         // active tab
  practiceQueue: [],              // current practice queue (filtered, shuffled)
  practiceIndex: 0,               // current position in practice queue
  practiceAnswered: false,        // whether current word has been answered
  practiceMode: 'spelling',       // 'spelling' = 看中文默写英文, 'copying' = 看英文抄写
  showCopyChinese: false,         // whether to show Chinese in copy mode (persistent toggle)
  reviewActive: false,            // whether in review mode
  reviewQueue: [],                // review-specific queue
  reviewIndex: 0,
  reviewAnswered: false,
};

// ===== PERSISTENCE =====
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      appState.masteredWords = new Set(saved.masteredWords || []);
      appState.reviewData = saved.reviewData || {};
      appState.practiceHistory = saved.practiceHistory || [];
      appState.accuracyData = saved.accuracyData || { total: 0, correct: 0 };
      appState.practiceMode = saved.practiceMode || 'spelling';
      appState.showCopyChinese = saved.showCopyChinese || false;
    }
  } catch (e) {
    console.warn('Failed to load state:', e);
  }
}

function saveState() {
  try {
    const toSave = {
      masteredWords: Array.from(appState.masteredWords),
      reviewData: appState.reviewData,
      practiceHistory: appState.practiceHistory.slice(-500), // keep last 500
      accuracyData: appState.accuracyData,
      practiceMode: appState.practiceMode,
      showCopyChinese: appState.showCopyChinese,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {
    console.warn('Failed to save state:', e);
  }
}

// ===== HELPERS =====
function getWordStatus(wordId) {
  if (appState.masteredWords.has(wordId)) return 'mastered';
  if (appState.reviewData[wordId] && appState.reviewData[wordId].repetitions > 0) return 'learning';
  return 'not-learned';
}

function getStatusLabel(status) {
  const map = { 'not-learned': '未学习', 'learning': '学习中', 'mastered': '已掌握' };
  return map[status] || '未知';
}

function getStatusClass(status) {
  return 'status-badge ' + status;
}

function getTodayStr() {
  return new Date().toISOString().split('T')[0];
}

function isDueToday(wordId) {
  const rd = appState.reviewData[wordId];
  if (!rd || !rd.nextReviewDate) return true; // never reviewed = due
  return rd.nextReviewDate <= getTodayStr();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function normalizeAnswer(text) {
  // case-insensitive, trim whitespace, collapse multiple spaces
  return text.trim().replace(/\s+/g, ' ').toLowerCase();
}

function getFilteredEntries(category, excludeMastered = true) {
  let entries;
  if (category === 'all') {
    entries = [...VOCAB_DATA];
  } else {
    const parts = category.split('|||');
    if (parts.length === 2) {
      entries = VOCAB_DATA.filter(e => e.categoryGroup === parts[0] && e.category === parts[1]);
    } else {
      entries = VOCAB_DATA.filter(e => e.categoryGroup === category);
    }
  }
  if (excludeMastered) {
    entries = entries.filter(e => !appState.masteredWords.has(e.id));
  }
  return entries;
}

// ===== SM-2 ALGORITHM =====
function updateReviewData(wordId, quality) {
  // quality: 5=perfect, 4=correct, 3=correct(hard), 2=wrong(easy), 1=wrong(hard), 0=blackout
  let rd = appState.reviewData[wordId] || {
    interval: 0,
    repetitions: 0,
    easiness: 2.5,
    nextReviewDate: getTodayStr(),
    lastReviewDate: null,
  };

  rd.lastReviewDate = getTodayStr();

  if (quality >= 3) {
    // Correct answer
    if (rd.repetitions === 0) {
      rd.interval = 1;
    } else if (rd.repetitions === 1) {
      rd.interval = 3;
    } else if (rd.repetitions === 2) {
      rd.interval = 7;
    } else if (rd.repetitions === 3) {
      rd.interval = 14;
    } else {
      rd.interval = Math.round(rd.interval * rd.easiness);
    }
    rd.repetitions += 1;
    rd.easiness = Math.max(1.3, rd.easiness + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  } else {
    // Incorrect answer
    rd.repetitions = 0;
    rd.interval = 1;
    rd.easiness = Math.max(1.3, rd.easiness - 0.2);
  }

  // Calculate next review date
  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + rd.interval);
  rd.nextReviewDate = nextDate.toISOString().split('T')[0];

  appState.reviewData[wordId] = rd;
  saveState();
}

function buildSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = ''; // Clear before rebuild to prevent duplication

  // Group entries
  const groups = {};
  VOCAB_DATA.forEach(e => {
    const g = e.categoryGroup || '其他';
    if (!groups[g]) groups[g] = {};
    const c = e.category || '其他';
    if (!groups[g][c]) groups[g][c] = 0;
    groups[g][c]++;
  });

  // "All" button
  const allBtn = document.createElement('div');
  allBtn.className = 'nav-all' + (appState.currentCategory === 'all' ? ' active' : '');
  allBtn.innerHTML = `<span>全部词汇</span><span class="count">${VOCAB_DATA.length}</span>`;
  allBtn.addEventListener('click', () => { selectCategory('all'); });
  nav.appendChild(allBtn);

  // Category groups — sorted by custom order
  const groupNames = Object.keys(groups);
  const order = getCategoryOrder();
  groupNames.sort((a, b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  for (const groupName of groupNames) {
    const cats = groups[groupName];
    const totalInGroup = Object.values(cats).reduce((a, b) => a + b, 0);
    
    const groupDiv = document.createElement('div');
    groupDiv.className = 'cat-group';
    
    const header = document.createElement('div');
    header.className = 'cat-group-header expanded';
    header.innerHTML = `<span class="arrow">&#9654;</span><span>${truncateText(groupName, 22)}</span><span class="count">${totalInGroup}</span>`;
    header.addEventListener('click', () => {
      header.classList.toggle('expanded');
    });
    
    const items = document.createElement('div');
    items.className = 'cat-items';
    
    for (const [catName, count] of Object.entries(cats)) {
      const item = document.createElement('div');
      item.className = 'cat-item';
      const catKey = groupName + '|||' + catName;
      if (appState.currentCategory === catKey) item.classList.add('active');
      item.innerHTML = `<span>${truncateText(catName, 24)}</span><span class="count">${count}</span>`;
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        selectCategory(catKey);
      });
      items.appendChild(item);
    }
    
    groupDiv.appendChild(header);
    groupDiv.appendChild(items);
    nav.appendChild(groupDiv);
  }
}

function truncateText(text, maxLen) {
  return text.length > maxLen ? text.slice(0, maxLen) + '...' : text;
}

function selectCategory(catKey) {
  appState.currentCategory = catKey;
  appState.practiceIndex = 0;
  appState.practiceAnswered = false;
  appState.practiceQueue = [];
  appState.reviewActive = false;
  updatePracticeQueue();
  renderPractice();
  
  // Update sidebar highlights
  document.querySelectorAll('.nav-all').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
  
  if (catKey === 'all') {
    document.querySelector('.nav-all').classList.add('active');
  } else {
    const target = document.querySelector(`.cat-item[data-key="${catKey}"]`);
    // Rebuild to refresh
  }
  buildSidebar();
}

// ===== PRACTICE MODE =====
function updatePracticeQueue() {
  let entries = getFilteredEntries(appState.currentCategory, true);
  appState.practiceQueue = shuffleArray([...entries]);
  appState.practiceIndex = 0;
  appState.practiceAnswered = false;
}

function getCurrentWord() {
  if (appState.practiceIndex >= appState.practiceQueue.length) return null;
  return appState.practiceQueue[appState.practiceIndex];
}

function renderPractice() {
  const word = getCurrentWord();
  const card = document.getElementById('practiceCard');
  const empty = document.getElementById('practiceEmpty');
  const input = document.getElementById('practiceInput');
  const feedback = document.getElementById('practiceFeedback');
  const btnNext = document.getElementById('btnNext');
  const btnSkip = document.getElementById('btnSkip');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnMastered = document.getElementById('btnMastered');
  const notesDiv = document.getElementById('practiceNotes');
  const notesToggle = document.getElementById('btnNotesToggle');
  const chineseEl = document.getElementById('practiceChinese');

  // Reset
  input.value = '';
  input.className = 'practice-input';
  feedback.className = 'practice-feedback';
  feedback.innerHTML = '';
  btnNext.classList.remove('show');
  btnSkip.style.display = '';
  btnSkip.textContent = '\u23ED 跳过';
  btnSubmit.style.display = '';
  notesDiv.classList.remove('show');
  notesDiv.innerHTML = '';
  appState.practiceAnswered = false;

  // Update mode toggle buttons
  document.getElementById('modeSpelling').className = 'mode-btn' + (appState.practiceMode === 'spelling' ? ' active' : '');
  document.getElementById('modeCopying').className = 'mode-btn' + (appState.practiceMode === 'copying' ? ' active' : '');

  if (!word) {
    card.style.display = 'none';
    empty.style.display = 'block';
    document.getElementById('practiceProgress').innerHTML = '';
    chineseEl.textContent = '';
    document.getElementById('practiceHint').innerHTML = '';
    btnMastered.style.display = 'none';
    notesToggle.style.display = 'none';
    return;
  }

  card.style.display = '';
  empty.style.display = 'none';
  btnMastered.style.display = '';
  notesToggle.style.display = '';

  // Check if current word is mastered
  const isMastered = appState.masteredWords.has(word.id);
  btnMastered.textContent = isMastered ? '\u2B50 取消掌握' : '\u2B50 标记掌握';
  btnMastered.className = 'btn-action btn-mastered' + (isMastered ? ' mastered' : '');

  // Progress
  const total = appState.practiceQueue.length;
  const current = appState.practiceIndex + 1;
  const pct = Math.round((appState.practiceIndex / total) * 100);
  document.getElementById('practiceProgress').innerHTML = `
    <span>${current} / ${total}</span>
    <div class="progress-bar-wrap"><div class="progress-bar-inner" style="width:${pct}%"></div></div>
    <span>${pct}%</span>
  `;

  if (appState.practiceMode === 'copying') {
    // Copy mode: show English, user copies it
    chineseEl.textContent = word.english;
    chineseEl.style.fontSize = word.type === 'sentence' ? '20px' : '28px';
    document.getElementById('practiceHint').innerHTML = `
      <span class="category-tag">抄写模式</span>
      <span class="type-tag">${word.type === 'sentence' ? '句型' : '单词/短语'}</span>
    `;
    input.placeholder = '抄写上方内容...';
    // Show Chinese toggle — persist state across words
    const copyCnDiv = document.getElementById('practiceCopyCn');
    copyCnDiv.textContent = word.chinese;
    copyCnDiv.className = 'practice-copy-cn' + (appState.showCopyChinese ? ' show' : '');
    const copyCnToggle = document.getElementById('btnCopyCnToggle');
    copyCnToggle.className = 'btn-action btn-copy-cn-toggle show';
    copyCnToggle.textContent = appState.showCopyChinese ? '\uD83D\uDC41 隐藏中文' : '\uD83D\uDC41 显示中文';
  } else {
    // Spelling mode: show Chinese, user types English
    chineseEl.textContent = word.chinese;
    chineseEl.style.fontSize = '28px';
    const typeLabel = word.type === 'sentence' ? '句型' : '单词/短语';
    document.getElementById('practiceHint').innerHTML = `
      <span class="category-tag">${word.category || ''}</span>
      <span class="type-tag">${typeLabel}</span>
    `;
    input.placeholder = '输入英文...';
    // Hide copy-mode Chinese elements
    document.getElementById('practiceCopyCn').className = 'practice-copy-cn';
    document.getElementById('btnCopyCnToggle').className = 'btn-action btn-copy-cn-toggle';
  }

  // Notes
  if (word.notes) {
    notesDiv.textContent = '\uD83D\uDCCC ' + word.notes;
  } else {
    notesDiv.textContent = '\uD83D\uDCCC 暂无额外提示';
  }

  input.focus();
}

function submitAnswer() {
  if (appState.practiceAnswered) return;
  const word = getCurrentWord();
  if (!word) return;

  const input = document.getElementById('practiceInput');
  const feedback = document.getElementById('practiceFeedback');
  const btnNext = document.getElementById('btnNext');
  const btnSubmit = document.getElementById('btnSubmit');
  const userAnswer = normalizeAnswer(input.value);
  const correctAnswer = normalizeAnswer(word.english);

  appState.practiceAnswered = true;

  // Check correctness
  const isCorrect = userAnswer === correctAnswer;

  // Update accuracy
  appState.accuracyData.total += 1;
  if (isCorrect) appState.accuracyData.correct += 1;

  // Record history
  appState.practiceHistory.push({
    wordId: word.id,
    correct: isCorrect,
    timestamp: Date.now(),
  });

  // Update review data
  updateReviewData(word.id, isCorrect ? 4 : 1);

  // Show feedback
  input.className = 'practice-input ' + (isCorrect ? 'correct' : 'incorrect');
  feedback.className = 'practice-feedback show ' + (isCorrect ? 'correct' : 'incorrect');
  
  if (isCorrect) {
    feedback.innerHTML = `
      <div>&#x2705; <strong>正确!</strong></div>
      <div class="feedback-answer">${word.english}</div>
    `;
  } else {
    feedback.innerHTML = `
      <div>&#x274C; <strong>不正确</strong></div>
      <div>你的输入: <em>${escapeHtml(input.value.trim())}</em></div>
      <div class="feedback-answer">正确答案: ${word.english}</div>
    `;
  }

  btnSubmit.style.display = 'none';
  document.getElementById('btnSkip').style.display = 'none';
  btnNext.classList.add('show');
  btnNext.focus();

  saveState();
}

function goNext() {
  appState.practiceIndex++;
  appState.practiceAnswered = false;
  
  if (appState.practiceIndex >= appState.practiceQueue.length) {
    // Reshuffle
    updatePracticeQueue();
  }
  
  renderPractice();
  updateAllStats();
}

function goPrev() {
  if (appState.practiceIndex <= 0) return;
  appState.practiceIndex--;
  appState.practiceAnswered = false;
  renderPractice();
  updateAllStats();
}

function toggleMastered() {
  const word = getCurrentWord();
  if (!word) return;

  if (appState.masteredWords.has(word.id)) {
    appState.masteredWords.delete(word.id);
  } else {
    appState.masteredWords.add(word.id);
  }
  
  saveState();
  updatePracticeQueue();
  renderPractice();
  updateAllStats();
}

function setPracticeMode(mode) {
  appState.practiceMode = mode;
  appState.practiceAnswered = false;
  saveState();
  renderPractice();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function populateWordbookCategories() {
  const groups = [];
  const seen = new Set();
  VOCAB_DATA.forEach(e => {
    const g = e.categoryGroup || '其他';
    if (!seen.has(g)) { seen.add(g); groups.push(g); }
  });
  // Sort by the same custom order as the sidebar
  const order = getCategoryOrder();
  groups.sort((a, b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  sel.innerHTML = '<option value="all">全部分类</option>';
  groups.forEach(g => {
    sel.innerHTML += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`;
  });

  }
  if (typeFilter !== 'all') {
    entries = entries.filter(e => e.type === typeFilter);
  }
  if (catFilter !== 'all') {

  }

  document.getElementById('wbCount').textContent = `共 ${entries.length} 条`;

  let html = `<table><thead><tr>

  entries.forEach((e, idx) => {
    const status = getWordStatus(e.id);
    const typeLabel = e.type === 'sentence' ? '句型' : '单词';
    html += `<tr>
      <td>${idx + 1}</td>
      <td style="font-weight:600;color:#222">${escapeHtml(e.english)}</td>
      <td>${escapeHtml(e.chinese)}</td>

      </td>

  });

  html += '</tbody></table>';
  document.getElementById('wordTable').innerHTML = html;

    appState.masteredWords.delete(wordId);
  } else {
    appState.masteredWords.add(wordId);
  }
  saveState();
  renderWordBook();
  updateAllStats();
  updatePracticeQueue();
  renderPractice();
}

      const interval = rd.interval || 0;
      listHtml += `<tr>
        <td style="font-weight:600;padding:8px 12px;border-bottom:1px solid #f0f0f0">${escapeHtml(e.english)}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #f0f0f0">${escapeHtml(e.chinese)}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#888">${lastReview}</td>
        <td style="padding:8px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#888">${interval}天</td>
      </tr>`;
    });
    listHtml += '</tbody></table>';
  }
  document.getElementById('reviewList').innerHTML = listHtml;

  // Start review button
  const btn = document.getElementById('btnStartReview');
  btn.textContent = dueWords.length > 0 ? `\u25B6 开始复习 (${dueWords.length} 个待复习)` : '\u25B6 没有待复习词汇';
  btn.disabled = dueWords.length === 0;

  // Hide review practice card
  document.getElementById('reviewPracticeCard').style.display = 'none';
  appState.reviewActive = false;
}

function startReview() {
  const dueWords = getDueWords();
  if (dueWords.length === 0) return;

  appState.reviewActive = true;
  appState.reviewQueue = shuffleArray([...dueWords]);
  appState.reviewIndex = 0;
  appState.reviewAnswered = false;

  document.getElementById('reviewList').parentElement.style.display = 'none';
  document.getElementById('btnStartReview').style.display = 'none';
  renderReviewWord();
}

function renderReviewWord() {
  if (appState.reviewIndex >= appState.reviewQueue.length) {
    // Done
    document.getElementById('reviewPracticeCard').innerHTML = `
      <div style="text-align:center;padding:40px">
        <div style="font-size:48px;margin-bottom:16px">&#x1F389;</div>
        <div style="font-size:20px;font-weight:700;color:#34a853;margin-bottom:8px">复习完成!</div>
        <div style="color:#888;margin-bottom:20px">已复习 ${appState.reviewQueue.length} 个词汇</div>
        <button class="btn-action btn-next show" onclick="finishReview()" style="display:inline-flex;margin:0 auto">
          &#x21A9; 返回列表
        </button>
      </div>
    `;
    document.getElementById('reviewPracticeCard').style.display = '';
    appState.reviewActive = false;
    updateAllStats();
    return;
  }

  const word = appState.reviewQueue[appState.reviewIndex];
  const total = appState.reviewQueue.length;
  const current = appState.reviewIndex + 1;

  document.getElementById('reviewPracticeCard').style.display = '';
  document.getElementById('reviewPracticeCard').innerHTML = `
    <div class="practice-progress">
      <span>复习 ${current} / ${total}</span>
      <div class="progress-bar-wrap" style="flex:1;margin:0 16px"><div class="progress-bar-inner" style="width:${Math.round((appState.reviewIndex/total)*100)}%"></div></div>
    </div>
    <div class="practice-chinese">${escapeHtml(word.chinese)}</div>
    <div class="practice-hint">
      <span class="category-tag">${escapeHtml(word.category || '')}</span>
      <span class="type-tag">${word.type === 'sentence' ? '句型' : '单词/短语'}</span>
    </div>
    <div class="practice-input-row">
      <input type="text" class="practice-input" id="rvInput" placeholder="输入英文..." autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-submit" id="rvBtnSubmit">&#x2713; 提交</button>
    </div>
    <div class="practice-feedback" id="rvFeedback"></div>
    <div class="practice-actions">
      <button class="btn-action btn-next" id="rvBtnNext" style="display:none">&#x27A1; 下一个</button>
    </div>
  `;

  appState.reviewAnswered = false;

  // Bind events
  document.getElementById('rvInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      if (appState.reviewAnswered) rvGoNext();
      else rvSubmitAnswer();
    }
  });
  document.getElementById('rvBtnSubmit').addEventListener('click', rvSubmitAnswer);
  document.getElementById('rvBtnNext').addEventListener('click', rvGoNext);
  setTimeout(() => document.getElementById('rvInput').focus(), 100);
}

function rvSubmitAnswer() {
  if (appState.reviewAnswered) return;
  const word = appState.reviewQueue[appState.reviewIndex];
  if (!word) return;

  const input = document.getElementById('rvInput');
  const feedback = document.getElementById('rvFeedback');
  const btnNext = document.getElementById('rvBtnNext');
  const btnSubmit = document.getElementById('rvBtnSubmit');

  const userAnswer = normalizeAnswer(input.value);
  const correctAnswer = normalizeAnswer(word.english);
  const isCorrect = userAnswer === correctAnswer;

  appState.reviewAnswered = true;

  // Update accuracy and review data
  appState.accuracyData.total += 1;
  if (isCorrect) appState.accuracyData.correct += 1;
  updateReviewData(word.id, isCorrect ? 4 : 1);

  appState.practiceHistory.push({
    wordId: word.id,
    correct: isCorrect,
    timestamp: Date.now(),
  });

  input.className = 'practice-input ' + (isCorrect ? 'correct' : 'incorrect');
  feedback.className = 'practice-feedback show ' + (isCorrect ? 'correct' : 'incorrect');

  if (isCorrect) {
    feedback.innerHTML = `<div>&#x2705; <strong>正确!</strong></div><div class="feedback-answer">${escapeHtml(word.english)}</div>`;
  } else {
    feedback.innerHTML = `<div>&#x274C; <strong>不正确</strong></div><div>你的输入: <em>${escapeHtml(input.value.trim())}</em></div><div class="feedback-answer">正确答案: ${escapeHtml(word.english)}</div>`;
  }

  btnSubmit.style.display = 'none';
  btnNext.style.display = '';
  btnNext.focus();
  saveState();
}

function rvGoNext() {
  appState.reviewIndex++;
  appState.reviewAnswered = false;
  renderReviewWord();
  document.getElementById('rvDueCount').textContent = getDueWords().length;
}

function finishReview() {
  renderReviewPanel();
  document.getElementById('reviewList').parentElement.style.display = '';
  document.getElementById('btnStartReview').style.display = '';
  document.getElementById('reviewPracticeCard').style.display = 'none';
  appState.reviewActive = false;
  updateAllStats();
}

// ===== STATISTICS =====
function renderStats() {
  const masteredCount = appState.masteredWords.size;
  const totalCount = VOCAB_DATA.length;
  const learningCount = totalCount - masteredCount - VOCAB_DATA.filter(e => getWordStatus(e.id) === 'not-learned').length;
  const notLearnedCount = totalCount - masteredCount - Object.keys(appState.reviewData).filter(id => appState.reviewData[id].repetitions > 0).length;

  const dueCount = getDueWords().length;
  const todayReviewed = appState.practiceHistory.filter(h => {
    const d = new Date(h.timestamp).toISOString().split('T')[0];
    return d === getTodayStr();
  }).length;

  const accuracy = appState.accuracyData.total > 0
    ? Math.round((appState.accuracyData.correct / appState.accuracyData.total) * 100)
    : 0;

  document.getElementById('stTotal').textContent = totalCount;
  document.getElementById('stMastered').textContent = masteredCount;
  document.getElementById('stReviewedToday').textContent = todayReviewed;
  document.getElementById('stDueCount').textContent = dueCount;
  document.getElementById('stAccuracy').textContent = accuracy + '%';
  document.getElementById('stLearning').textContent = Object.keys(appState.reviewData).filter(id => appState.reviewData[id].repetitions > 0).length;

  // Category breakdown
  const catStats = {};
  VOCAB_DATA.forEach(e => {
    const key = e.categoryGroup || '其他';
    if (!catStats[key]) catStats[key] = { total: 0, mastered: 0 };
    catStats[key].total++;
    if (appState.masteredWords.has(e.id)) catStats[key].mastered++;
  });

  let tableHtml = '<table><thead><tr><th>分类</th><th>总数</th><th>已掌握</th><th>掌握率</th></tr></thead><tbody>';
  for (const [cat, stats] of Object.entries(catStats)) {
    const rate = stats.total > 0 ? Math.round((stats.mastered / stats.total) * 100) : 0;
    tableHtml += `<tr>
      <td>${escapeHtml(cat)}</td>
      <td>${stats.total}</td>
      <td>${stats.mastered}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:6px;background:#e8eaed;border-radius:3px;overflow:hidden">
            <div style="height:100%;background:#34a853;border-radius:3px;width:${rate}%"></div>
          </div>
          <span style="font-size:12px;color:#888;min-width:35px">${rate}%</span>
        </div>
      </td>
    </tr>`;
  }
  tableHtml += '</tbody></table>';
  document.getElementById('statsTable').innerHTML = tableHtml;
}

function updateAllStats() {
  if (appState.currentTab === 'stats') renderStats();
  if (appState.currentTab === 'review') renderReviewPanel();
}

// ===== TAB SWITCHING =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    appState.currentTab = tab;

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');

    if (tab === 'wordbook') renderWordBook();
    if (tab === 'review') renderReviewPanel();
    if (tab === 'stats') renderStats();
    if (tab === 'practice') renderPractice();
  });
});

// ===== EVENT LISTENERS =====
document.getElementById('practiceInput').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && !e.ctrlKey && !e.altKey) {
    if (appState.practiceIndex > 0 && !appState.reviewActive) goPrev();
    return;
  }
  if (e.key === 'ArrowRight' && !e.ctrlKey && !e.altKey) {
    if (!appState.reviewActive) { goNext(); }
    return;
  }
  if (e.key === 'Enter') {
    if (appState.practiceAnswered) goNext();
    else submitAnswer();
  }
});

document.getElementById('btnSubmit').addEventListener('click', submitAnswer);
document.getElementById('btnNext').addEventListener('click', goNext);
document.getElementById('btnPrev').addEventListener('click', goPrev);
document.getElementById('btnSkip').addEventListener('click', goNext);
document.getElementById('btnMastered').addEventListener('click', toggleMastered);
document.getElementById('btnCopyCnToggle').addEventListener('click', () => {
  appState.showCopyChinese = !appState.showCopyChinese;
  const cnDiv = document.getElementById('practiceCopyCn');
  const btn = document.getElementById('btnCopyCnToggle');
  if (appState.showCopyChinese) {
    cnDiv.classList.add('show');
    btn.textContent = '\uD83D\uDC41 隐藏中文';
  } else {
    cnDiv.classList.remove('show');
    btn.textContent = '\uD83D\uDC41 显示中文';
  }
  saveState();
});
document.getElementById('btnNotesToggle').addEventListener('click', () => {
  document.getElementById('practiceNotes').classList.toggle('show');
});

document.getElementById('btnStartReview').addEventListener('click', startReview);
document.getElementById('wbSearch').addEventListener('input', renderWordBook);
document.getElementById('wbCategoryFilter').addEventListener('change', renderWordBook);
document.getElementById('wbStatusFilter').addEventListener('change', renderWordBook);
document.getElementById('wbTypeFilter').addEventListener('change', renderWordBook);

// ===== INITIALIZATION =====
function init() {
  loadState();
  buildSidebar();
  populateWordbookCategories();
  updatePracticeQueue();
  renderPractice();
  updateAllStats();
}

init();
</script>

</body>
</html>
